<style>

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#f3f4f6;
  color:#111827;
}
header{
  background:#1e293b;
  color:#fff;
  padding:18px;
}
header h1{margin:0}
header p{margin:4px 0 0;color:#c7d2fe}

.container{
  max-width:1100px;
  margin:24px auto;
  padding:0 16px;
}
.section{
  margin-bottom:32px;
}
.section h2{
  margin-bottom:12px;
  color:#1e293b;
}
.card{
  background:#fff;
  padding:16px;
  border-radius:10px;
  box-shadow:0 4px 12px rgba(0,0,0,.1);
}
article{
  border-bottom:1px solid #e5e7eb;
  padding:12px 0;
}
article:last-child{border:none}
.tag{
  display:inline-block;
  background:#e0e7ff;
  color:#3730a3;
  padding:3px 6px;
  font-size:12px;
  border-radius:5px;
}

a:hover{text-decoration:underline}

  background:#1e293b;
  color:#c7d2fe;
  text-align:center;
  padding:14px;
  margin-top:40px;
}
</style>

<body>

<header>
  <h1>EduInfo TN</h1>
  <p>Live Tamil Nadu Board & CBSE Education Updates</p>
</header>

<div class="container">

  <!-- TN BOARD SECTION -->
  <div class="section">
    <h2>📘 Tamil Nadu Board Updates</h2>
    <div class="card" id="tn-news">
      <p>Loading TN Board updates...</p>
    </div>
  </div>

  <!-- CBSE SECTION -->
  <div class="section">
    <h2>📗 CBSE & National Education Updates</h2>
    <div class="card" id="cbse-news">
      <p>Loading CBSE updates...</p>
    </div>
  </div>

</div>

<footer>
  © EduInfo TN | Auto-Updated Education Portal
</footer>

<script>
// ===== RSS SOURCES =====
const TN_RSS =
 "https://api.rss2json.com/v1/api.json?rss_url=https://www.thehindu.com/news/national/tamil-nadu/feeder/default.rss";

const CBSE_RSS =
 "https://api.rss2json.com/v1/api.json?rss_url=https://www.thehindu.com/education/feeder/default.rss";

// ===== FUNCTION TO LOAD NEWS =====
function loadNews(url, elementId){
  fetch(url)
    .then(res => res.json())
    .then(data => {
      const box = document.getElementById(elementId);
      box.innerHTML = "";
      data.items.slice(0,8).forEach(item=>{
        const a = document.createElement("article");
        a.innerHTML = `
          <span class="tag">Live</span>
          <h3>${item.title}</h3>
          <p>${item.description.replace(/<[^>]*>?/gm,"").slice(0,180)}...</p>
          <a href="${item.link}" target="_blank">Read more</a>
        `;
        box.appendChild(a);
      });
    })
    .catch(()=>{
      document.getElementById(elementId).innerHTML =
        "<p>Unable to load updates right now.</p>";
    });
}

// ===== INITIAL LOAD =====
loadNews(TN_RSS, "tn-news");
loadNews(CBSE_RSS, "cbse-news");

// ===== AUTO REFRESH EVERY 1 HOUR =====
setInterval(()=>{
  loadNews(TN_RSS, "tn-news");
  loadNews(CBSE_RSS, "cbse-news");
}, 3600000); // 1 hour
</script>

</body>
