<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="google-site-verification" content="ns1DCQuBWwSoUUhUj0npJ1ePKIk3pOQDlBKLlKTQRcM" />

<title>EduInfo TN | Modern Education Portal</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="EduInfo TN - TN Board, CBSE, Competitive Exams, Live News & Games">

<style>
body{
margin:0;
font-family:Arial;
background:#f1f5f9;
}

header{
background:linear-gradient(90deg,#1e293b,#2563eb);
color:white;
padding:20px;
text-align:center;
}

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:20px;
}

.card{
background:white;
padding:16px;
border-radius:12px;
box-shadow:0 6px 20px rgba(0,0,0,.1);
}

h2{
margin-top:0;
}

article{
border-bottom:1px solid #eee;
padding:10px 0;
}

article:last-child{
border:none;
}

.tag{
background:#e0e7ff;
padding:4px 8px;
font-size:12px;
border-radius:5px;
}

button{
padding:10px;
background:#2563eb;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

iframe{
width:100%;
border:none;
border-radius:10px;
}

footer{
text-align:center;
padding:20px;
background:#1e293b;
color:white;
margin-top:30px;
}
</style>
</head>

<body>

<header>
<h1>EduInfo TN</h1>
<p>TN Board • CBSE • Competitive Exams • Games</p>
</header>

<div class="container">

<div class="grid">

<!-- TN NEWS -->
<div class="card">
<h2>📘 TN Education</h2>
<div id="tn-news">Loading...</div>
</div>

<!-- CBSE -->
<div class="card">
<h2>📗 CBSE News</h2>
<div id="cbse-news">Loading...</div>
</div>

<!-- COMPETITIVE -->
<div class="card">
<h2>🎓 Competitive Exams</h2>
<div id="exam-news">Loading...</div>
</div>

<!-- GAME -->
<div class="card">
<h2>🎮 Game</h2>

<p id="score">Score: 0</p>
<button onclick="increase()">Click Me</button>

<hr>

<iframe src="https://play2048.co/" height="300"></iframe>

</div>

</div>

</div>

<footer>
© EduInfo TN | Modern Portal
</footer>

<script>

// GAME
let score=0;
function increase(){
score++;
document.getElementById("score").innerText="Score: "+score;
}

// LOAD NEWS
function loadNews(url,id){
fetch(url)
.then(res=>res.text())
.then(str=>new window.DOMParser().parseFromString(str,"text/xml"))
.then(data=>{
const items=data.querySelectorAll("item");
const box=document.getElementById(id);
box.innerHTML="";

items.forEach((el,i)=>{
if(i>=5)return;

const title=el.querySelector("title").textContent;
const link=el.querySelector("link").textContent;

const article=document.createElement("article");
article.innerHTML=`
<span class="tag">Live</span>
<h4>${title}</h4>
<a href="${link}" target="_blank">Read more</a>
`;

box.appendChild(article);
});
})
.catch(()=>{
document.getElementById(id).innerHTML="Failed to load";
});
}

// SOURCES (Google News → includes BBC, TOI, Hindu, Polimer)
loadNews("https://news.google.com/rss/search?q=tamil+nadu+education","tn-news");
loadNews("https://news.google.com/rss/search?q=cbse+india","cbse-news");
loadNews("https://news.google.com/rss/search?q=competitive+exam+india","exam-news");

// REFRESH
setInterval(()=>{
location.reload();
},3600000);

</script>

</body>
</html>
